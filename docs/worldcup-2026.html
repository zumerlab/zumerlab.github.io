<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/@zumer/orbit@latest/dist/orbit.css">
<script src="https://unpkg.com/@zumer/orbit@latest/dist/orbit.js"></script>
<link rel="stylesheet" href="https://unpkg.com/zumly@0.92.3/dist/zumly.css">
<script src="https://unpkg.com/zumly@0.92.3/dist/zumly.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap');
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#08080d;font-family:Inter;overflow:hidden}
.stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:64px 16px 34px;overflow:hidden;
  background:radial-gradient(ellipse 74% 74% at 50% 52%,#1d1508 0%,#08080d 60%)}
.scaler{transform-origin:center center;transition:transform .15s ease-out}
.zumly-canvas{width:780px;height:780px;position:relative}
.z-view{width:780px;height:780px}
.wrap{position:relative;width:780px;height:780px}
.keys{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.key{fill:none;stroke:#5a6072;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.key.dim{stroke:#363b49;stroke-width:1.4}
.key.won{stroke:#ffd34d;stroke-width:2.8;filter:drop-shadow(0 0 5px #ffd34d88)}
.bigbang{position:absolute;inset:0;z-index:2}
.satellite{border:none}
.flag{display:block;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #2c2c38,0 2px 6px #000b;background:#222}
.flag.s12{width:44px;height:44px}
.flag.lost{filter:grayscale(1);opacity:1;box-shadow:0 0 0 2px #2c2c38,0 2px 6px #000b}
.flag.won{box-shadow:0 0 0 2.5px #ffd34d,0 0 13px #ffd34daa}
.flag.tbd{border-radius:50%;background:repeating-conic-gradient(#15151d 0 30deg,#1f1f27 0 60deg);box-shadow:0 0 0 2px #2a2a34}
.zoom-me{cursor:pointer;transition:transform .12s}
.flag.zoom-me:hover{transform:scale(1.12)}
.onode.zoom-me:hover{transform:scale(1.14)}
.onode{position:absolute;border-radius:50%;object-fit:cover;z-index:50;box-shadow:0 0 0 2px #2c2c38,0 2px 6px #000b;background:#222}
.onode.won{box-shadow:0 0 0 2.5px #ffd34d,0 0 13px #ffd34daa}
.onode.tbd{background:repeating-conic-gradient(#15151d 0 30deg,#1f1f27 0 60deg);box-shadow:0 0 0 2px #2a2a34}
.onode.up{box-shadow:0 0 0 2px #5a6072,0 0 8px #5a607255;cursor:pointer}
.crest{position:absolute;width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 2px 4px #000a);z-index:3}
.crest.lost{filter:grayscale(1) opacity(.55) drop-shadow(0 2px 4px #000a)}
.dot{fill:#4a4f60}
.dot.won{fill:#ffd34d}
.trophy{position:relative;z-index:3;display:flex;align-items:center;justify-content:center}
.trophy-img{height:128px;width:auto;filter:drop-shadow(0 0 20px #ffb2227a) drop-shadow(0 4px 10px #0009)}
/* MATCH VIEW */
.match-view{position:absolute;inset:0;width:780px;height:780px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 50%,rgba(8,8,13,.10),rgba(8,8,13,.48));cursor:zoom-out}
.mc-card{position:relative;width:560px;max-width:90%;background:linear-gradient(180deg,#141420,#0e0e16);
  border:1px solid #26262f;border-radius:22px;padding:34px 38px 26px;box-shadow:0 30px 80px #000c, inset 0 1px 0 #ffffff0a;color:#eef0f6}
.mc-close{position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:50%;border:1px solid #33333f;
  background:#1a1a24;color:#9a9fb0;font-size:14px;cursor:pointer;line-height:1}
.mc-close:hover{background:#24242f;color:#fff}
.mc-round{text-align:center;color:#ffd34d;font-weight:700;font-size:11px;letter-spacing:.26em;text-transform:uppercase;margin-bottom:22px}
.mc-main{display:flex;align-items:center;justify-content:space-between;gap:14px}
.mc-team{display:flex;flex-direction:column;align-items:center;gap:8px;width:150px}
.mc-crest{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 2px 5px #000a)}
.mc-flag{width:46px;height:46px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #2c2c38}
.mc-name{font-weight:700;font-size:14px;text-align:center;color:#cfd2dc}
.mc-team.won .mc-name{color:#ffd84f}
.mc-team.won .mc-flag{box-shadow:0 0 0 2.5px #ffd34d,0 0 12px #ffd34d88}
.mc-score{font-weight:800;font-size:40px;letter-spacing:1px;min-width:120px;text-align:center}
.mc-dash{color:#5a6072;margin:0 8px}
.mc-pens{font-size:11px;font-weight:700;color:#ffd34d;letter-spacing:.12em;margin-top:4px;text-transform:uppercase}
.mc-goals{display:flex;align-items:flex-start;gap:0;margin-top:24px;border-top:1px solid #22222c;padding-top:18px}
.mc-col{flex:1;display:flex;flex-direction:column;gap:7px}
.mc-col:first-child{text-align:right;align-items:flex-end}
.mc-col:last-child{text-align:left;align-items:flex-start}
.mc-divider{width:1px;align-self:stretch;background:#22222c;margin:0 16px}
.mc-goal{font-size:12.5px;color:#d4d7e0}
.mc-goal.dim{color:#565b6b;font-style:italic}
.mc-min{color:#ffd34d;font-weight:700;font-size:11px}
.mc-venue{text-align:center;color:#6b7080;font-size:11px;letter-spacing:.08em;margin-top:20px}
.mc-hint{text-align:center;color:#41465680;font-size:9.5px;letter-spacing:.16em;margin-top:12px;text-transform:uppercase}
.title{position:fixed;top:22px;left:0;right:0;text-align:center;color:#eef0f6;font-weight:800;font-size:15px;letter-spacing:.34em;z-index:10}
.sub{position:fixed;top:46px;left:0;right:0;text-align:center;color:#ffd34d;font-weight:700;font-size:10px;letter-spacing:.28em;z-index:10}
.foot{position:fixed;bottom:30px;left:0;right:0;text-align:center;color:#3e4252;font-weight:600;font-size:9px;letter-spacing:.14em;z-index:10}
.brand{position:fixed;bottom:14px;left:0;right:0;text-align:center;z-index:10}
.brand a{color:#6b7080;font-weight:700;font-size:10px;letter-spacing:.2em;text-decoration:none}
.brand a:hover{color:#ffd34d}
.status{position:fixed;top:50%;left:0;right:0;text-align:center;color:#5a6072;font-weight:600;font-size:12px;z-index:20}
</style></head><body>

  function drawKeysNodes(){

    function level(childA, rC, rA, clsC, store, wonC){
      const out=[];
      const TAU=2*Math.PI, norm=x=>((x%TAU)+TAU)%TAU;
      for(let k=0;k<childA.length;k+=2){

        const clsA=clsC?clsC[k]:'key', clsB=clsC?clsC[k+1]:'key';

        const ca=polar(rC,aa), cb=polar(rC,ab), sa=polar(rA,aa), sb=polar(rA,ab);

      crests+='<img class="crest'+(t.lost?' lost':'')+'" style="left:'+(x-h).toFixed(1)+'px;top:'+(y-h).toFixed(1)+'px" src="'+src+'" title="'+t.name+'">';
    }
    return '<svg class="keys" viewBox="0 0 '+BOX+' '+BOX+'">'+kn.keysHTML+'</svg>'+
      '<div class="bigbang"><div class="gravity-spot" style="--o-force:620px;">'+
      '<div class="orbit-12">'+ring+'</div>'+
      '<div class="orbit-0"><div class="satellite at-center"><div class="capsule"><div class="trophy"><img class="trophy-img" src="'+TROPHY+'"></div></div></div></div>'+
      '</div></div>'+
      '<div class="crests">'+crests+'</div>'+
      '<div class="nodes">'+kn.nodesHTML+'</div>';
  }

  function buildBracketView(){
    return '<div class="z-view bracket-view"><div class="wrap">'+bracketHTML()+'</div></div>';
  }

  function matchCardHTML(m){
    if(!m) return '<div class="mc-card">Sin datos del partido</div>';
    const w=winnerOf(m);
    const T=(name)=>({name,code:code(name),won:w===name});
    const t1=T(m.team1), t2=T(m.team2);
    const s=m.score||{};
    const ft=s.et||s.ft||[null,null];
    const pens=s.p||null;
    const aet=(s.et&&!pens)?'<div class="mc-pens">tiempo extra</div>':'';
    function row(t){
      const fl=t.code?'<img class="mc-flag" src="'+flagURL(t.code)+'">':'<div class="mc-flag"></div>';
      const cr=CRESTS[t.name]?'<img class="mc-crest" src="'+CRESTS[t.name]+'">':'';
      return '<div class="mc-team'+(t.won?' won':'')+'">'+cr+fl+'<div class="mc-name">'+t.name+'</div></div>';
    }
    function goals(gs){
      if(!gs||!gs.length) return '<div class="mc-goal dim">sin goles</div>';
      return gs.map(g=>'<div class="mc-goal"><span class="mc-min">'+(g.minute?g.minute+"\u2032":'')+'</span> '+(g.name||'')+'</div>').join('');
    }
    const score=(ft[0]!=null)?(ft[0]+'<span class="mc-dash">:</span>'+ft[1]):'vs';
    const pl=(pens?'<div class="mc-pens">penales '+pens[0]+'\u2013'+pens[1]+'</div>':'')+aet;
    const venue=[m.ground,m.date].filter(Boolean).join('  \u00b7  ');
    return '<div class="mc-card">'+
      '<button class="mc-close" data-close="1">\u2715</button>'+
      '<div class="mc-round">'+(m.round||'')+'</div>'+
      '<div class="mc-main">'+row(t1)+'<div class="mc-score">'+score+pl+'</div>'+row(t2)+'</div>'+
      ((ft[0]!=null)?('<div class="mc-goals"><div class="mc-col">'+goals(m.goals1)+'</div><div class="mc-divider"></div><div class="mc-col">'+goals(m.goals2)+'</div></div>'):'')+
      '<div class="mc-venue">'+venue+'</div>'+
      '<div class="mc-hint">\u2190 volver  \u00b7  scroll  \u00b7  \u2715</div>'+
      '</div>';
  }
  function buildMatchView(ctx){
    return '<div class="z-view match-view">'+matchCardHTML(byNum[+ctx.props.id])+'</div>';
  }

  // ---- driver custom: la view nueva EMERGE desde el trigger; el bracket queda quieto y se difumina ----
  function emergeDriver(spec, onComplete){
    const parseDur = d => { if(typeof d==='number'&&!isNaN(d)) return Math.max(0,d);
      const m=String(d).match(/^(\d+(?:\.\d+)?)\s*(ms|s)?$/i); if(!m) return 500;
      const v=parseFloat(m[1]), u=(m[2]||'s').toLowerCase(); return u==='ms'?Math.max(0,v):Math.max(0,v*1000); };
    const show = el => { if(el){ el.classList.remove('hide'); el.style.contentVisibility='visible'; } };
    const rm = (el,cv) => { try{ if(cv) cv.removeChild(el);}catch(e){ try{ if(el.parentElement) cv.removeChild(el.parentElement);}catch(e2){} } };
    const guard = (cleanup, ms) => { let done=false; const t=setTimeout(()=>{ if(!done){done=true;cleanup();} }, ms);
      return ()=>{ if(done)return; done=true; clearTimeout(t); cleanup(); }; };
    const { type, currentView, previousView, lastView, currentStage, duration, ease, canvas } = spec;
    if(!currentView || !previousView || !currentStage){ onComplete(); return; }
    const durMs = parseDur(duration);
    const v0 = currentStage.views[0]; // view nueva (match)
    const v1 = currentStage.views[1]; // view anterior (bracket)
    if(type==='zoomIn'){
      show(currentView); show(previousView); show(lastView);
      // bracket: se queda FULL (backwardState), no zoomea. El blur lo pone el engine via has-effect.
      previousView.style.transformOrigin = v1.backwardState.origin;
      previousView.style.transform = v1.backwardState.transform;
      // match: emerge desde el trigger
      currentView.style.transformOrigin = v0.backwardState.origin;
      currentView.style.transform = v0.backwardState.transform;
      const a = currentView.animate(
        [{transform:v0.backwardState.transform},{transform:v0.forwardState.transform}],
        {duration:durMs, easing:ease, fill:'forwards'});
      const finish = guard(()=>{ try{a.cancel();}catch(e){}
        currentView.classList.replace('is-new-current-view','is-current-view');
        currentView.classList.remove('zoom-current-view','has-no-events');
        currentView.style.transformOrigin = v0.forwardState.origin;
        currentView.style.transform = v0.forwardState.transform;
        previousView.classList.remove('zoom-previous-view','has-no-events');
        previousView.style.transformOrigin = v1.backwardState.origin;
        previousView.style.transform = v1.backwardState.transform;
        onComplete();
      }, durMs+150);
      a.finished.then(finish).catch(finish);
    } else if(type==='zoomOut'){
      show(currentView); show(previousView); show(lastView);
      const to1 = v1.backwardState;
      currentView.style.transformOrigin = v0.forwardState.origin;
      currentView.style.transform = v0.forwardState.transform;
      const a = currentView.animate(
        [{transform:v0.forwardState.transform},{transform:v0.backwardState.transform}],
        {duration:durMs, easing:ease, fill:'forwards'});
      const finish = guard(()=>{ try{a.cancel();}catch(e){}
        rm(currentView, canvas);
        previousView.classList.remove('zoom-previous-view-reverse','has-no-events','has-effect','has-effect-reverse');
        previousView.style.removeProperty('--z-effect-filter');
        previousView.style.transformOrigin = '0 0';
        previousView.style.transform = to1.transform;
        onComplete();
      }, durMs+150);
      a.finished.then(finish).catch(finish);
    } else { onComplete(); }
  }

  const app = new Zumly({
    mount:'#canvas', initialView:'bracket',
    views:{
      bracket:{ render:()=>buildBracketView(), mounted:()=>{ try{ if(window.Orbit&&Orbit.resize) Orbit.resize('.gravity-spot'); }catch(e){} } },
      match:(ctx)=>buildMatchView(ctx)
    },
    transitions:{ driver: emergeDriver, cover:'width', duration:'0.85s', ease:'cubic-bezier(.5,.02,.2,1)',
      effects:['blur(7px) brightness(.58)','blur(12px) saturate(.5) brightness(.5)'], hideTrigger:false },
    depthNav:true, lateralNav:false, inputs:{wheel:true,keyboard:true,click:true,touch:true}
  });
  await app.init();
  window.__zapp = app;
  // cerrar match con la X o scroll/back
  document.getElementById('canvas').addEventListener('click',(e)=>{
    if(e.target.closest('[data-close]') || e.target.classList.contains('match-view')){ e.stopPropagation(); app.back(); }
  });
  document.getElementById('status').style.display='none';
  fit();

  function fit(){
    const sc=document.querySelector('.scaler'); if(!sc) return;
    const s=Math.max(0.2, Math.min(1,(window.innerWidth-32)/BOX,(window.innerHeight-130)/BOX));
    sc.style.transform='scale('+s+')';
  }
  window.addEventListener('resize',fit);
})();
</script>
</body></html>
